<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myHomePage · 我的首页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c9b8e8'/%3E%3Cstop offset='1' stop-color='%23b8d4f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='10' fill='white' opacity='0.92'/%3E%3C/svg%3E">
<style>
:root{--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;--serif:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;--mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;background:#f7f6f3;color:#3c3b38}

/* 素雅弥散光背景：浅色底 + 低饱和微光，静止无动画 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 46% at 16% 14%, rgba(188,176,233,.24), transparent 70%),
    radial-gradient(40% 48% at 86% 10%, rgba(166,196,238,.20), transparent 70%),
    radial-gradient(36% 44% at 82% 92%, rgba(186,222,214,.20), transparent 70%),
    radial-gradient(30% 36% at 12% 90%, rgba(236,208,182,.16), transparent 70%);
  filter:blur(70px);
}

.brand{position:fixed;top:22px;left:26px;z-index:40;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:#8a8578;letter-spacing:.08em}
.brand i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#c9b8e8,#b8d4f7);box-shadow:0 0 10px rgba(150,130,220,.4)}

.stage{position:relative;z-index:2;min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 24px 80px;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;padding:48px 64px 40px;width:min(660px,92vw);
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.95);border-radius:28px;
  box-shadow:0 24px 60px rgba(60,55,80,.10),0 4px 14px rgba(60,55,80,.05)}
.clock{font-size:80px;font-weight:500;line-height:1.05;letter-spacing:.02em;color:#33322f;font-variant-numeric:tabular-nums}
.date{font-size:14px;margin-top:10px;color:#8b8a85;letter-spacing:.06em}
.greet{font-size:16px;margin-top:22px;color:#6f6e69}
.search-wrap{position:relative;width:min(560px,86vw);margin-top:18px}
.search{display:flex;align-items:center;width:100%;border:1px solid #e8e5de;background:rgba(255,255,255,.85);border-radius:999px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:#c3b8e8;box-shadow:0 0 0 4px rgba(178,160,232,.16)}
.eng-btn{display:flex;align-items:center;gap:7px;border:none;background:transparent;padding:0 6px 0 20px;height:52px;cursor:pointer;font-family:inherit;font-size:13.5px;color:#55544f;border-radius:999px 0 0 999px;transition:background .18s;flex-shrink:0}
.eng-btn:hover{background:rgba(0,0,0,.03)}
.eng-btn .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#c9b8e8,#b8d4f7);box-shadow:0 0 6px rgba(150,130,220,.35);flex-shrink:0}
.eng-btn .caret{font-size:9px;color:#9a978f;transition:transform .18s}
.eng-btn.open .caret{transform:rotate(180deg)}
.search .divider{width:1px;height:22px;background:#e5e2db;flex-shrink:0}
.search input{flex:1;min-width:0;height:52px;border:none;background:transparent;padding:0 20px 0 14px;font-size:15px;outline:none;font-family:inherit;color:#3c3b38}
.search input::placeholder{color:#b0aea7}
.eng-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:30;min-width:190px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #e9e6df;border-radius:16px;box-shadow:0 14px 34px rgba(60,55,80,.14);padding:6px;display:none;text-align:left}
.eng-menu.open{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.eng-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;padding:9px 12px;border-radius:11px;font-size:13.5px;color:#55544f;cursor:pointer;font-family:inherit;text-align:left;transition:background .15s}
.eng-item .lbl{flex:1}
.eng-item:hover{background:#f2f0eb}
.eng-item.active{color:#5b5580;font-weight:600;background:linear-gradient(135deg,#f3eefb,#e9f0f9)}
.eng-item .check{color:#8a7fb5;font-size:12px;opacity:0}
.eng-item.active .check{opacity:1}
.links{display:grid;grid-template-columns:repeat(5,104px);gap:18px;margin-top:40px}
.link{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;padding:18px 8px 15px;border-radius:16px;
  background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);color:#55544f;
  box-shadow:0 6px 16px rgba(60,55,80,.07);
  transition:transform .18s,box-shadow .18s,background .18s}
.link:hover{transform:translateY(-4px);background:rgba(255,255,255,.94);box-shadow:0 14px 28px rgba(60,55,80,.13)}
.ic{font-size:24px;line-height:1}
.lb{font-size:12.5px;color:#6f6e69}
.foot{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:#b5b2aa;letter-spacing:.12em;z-index:40}

@media (max-width:560px){
  .links{grid-template-columns:repeat(5,60px);gap:8px}
  .link{padding:12px 3px 10px}
  .clock{font-size:58px}
  .hero{padding:34px 18px 28px}
  .brand{font-size:12px}
}
</style>
</head>
<body>

<div class="brand"><i></i>shihewo.homepage</div>

<main class="stage">
  <div class="hero">
    <div class="clock">--:--</div>
    <div class="date">—</div>
    <div class="greet">—</div>
    <div class="search-wrap">
      <form class="search" id="searchForm" action="https://www.bing.com/search" method="get" target="_blank">
        <button type="button" class="eng-btn" id="engBtn" aria-haspopup="true">
          <span class="dot"></span>
          <span class="eng-label" id="engLabel">Bing</span>
          <span class="caret">▾</span>
        </button>
        <span class="divider"></span>
        <input type="text" name="q" placeholder="搜索或输入网址，回车直达 Bing" autocomplete="off">
      </form>
      <div class="eng-menu" id="engMenu">
        <button type="button" class="eng-item active" data-action="https://www.bing.com/search" data-name="Bing"><span class="lbl">Bing</span><span class="check">✓</span></button>
        <button type="button" class="eng-item" data-action="https://www.google.com/search" data-name="Google"><span class="lbl">Google</span><span class="check">✓</span></button>
        <button type="button" class="eng-item" data-action="https://duckduckgo.com/" data-name="DuckDuckGo"><span class="lbl">DuckDuckGo</span><span class="check">✓</span></button>
      </div>
    </div>
  </div>
  <nav class="links">
    <a class="link" href="https://www.bilibili.com" target="_blank" rel="noopener"><span class="ic">📺</span><span class="lb">bilibili</span></a>
    <a class="link" href="https://github.com" target="_blank" rel="noopener"><span class="ic">💻</span><span class="lb">GitHub</span></a>
    <a class="link" href="https://www.youtube.com" target="_blank" rel="noopener"><span class="ic">🎬</span><span class="lb">YouTube</span></a>
    <a class="link" href="https://mail.google.com" target="_blank" rel="noopener"><span class="ic">✉️</span><span class="lb">Gmail</span></a>
    <a class="link" href="https://mail.proton.me" target="_blank" rel="noopener"><span class="ic">🔐</span><span class="lb">ProtonMail</span></a>
  </nav>
</main>

<script>
function tick(){
  var d = new Date();
  var h = String(d.getHours()).padStart(2,'0');
  var m = String(d.getMinutes()).padStart(2,'0');
  var el = document.querySelector('.clock');
  if(el) el.textContent = h + ':' + m;
  var dt = document.querySelector('.date');
  if(dt){
    var wd = ['日','一','二','三','四','五','六'][d.getDay()];
    dt.textContent = (d.getMonth()+1) + '月 ' + d.getDate() + '日 · 星期' + wd;
  }
  var g = document.querySelector('.greet');
  if(g){
    var hr = d.getHours();
    g.textContent = hr < 6 ? '夜深了，注意休息'
      : hr < 10 ? '早上好，愿你被世界温柔以待'
      : hr < 12 ? '上午好，元气满满'
      : hr < 14 ? '中午好，别忘了好好吃饭'
      : hr < 18 ? '下午好，继续加油'
      : '晚上好，辛苦一天了';
  }
}
tick();
setInterval(tick, 1000);

// 搜索引擎切换（搜索框内左侧下拉按钮）
(function(){
  var form = document.getElementById('searchForm');
  var input = form.querySelector('input');
  var btn = document.getElementById('engBtn');
  var label = document.getElementById('engLabel');
  var menu = document.getElementById('engMenu');
  var items = menu.querySelectorAll('.eng-item');

  function setEngine(item){
    label.textContent = item.getAttribute('data-name');
    form.action = item.getAttribute('data-action');
    input.placeholder = '搜索或输入网址，回车直达 ' + item.getAttribute('data-name');
    items.forEach(function(i){ i.classList.toggle('active', i === item); });
  }
  function closeMenu(){
    menu.classList.remove('open');
    btn.classList.remove('open');
  }
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var isOpen = menu.classList.contains('open');
    closeMenu();
    if(!isOpen){
      menu.classList.add('open');
      btn.classList.add('open');
    }
  });
  items.forEach(function(item){
    item.addEventListener('click', function(e){
      e.stopPropagation();
      setEngine(item);
      closeMenu();
    });
  });
  document.addEventListener('click', function(){
    closeMenu();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeMenu();
  });
  // 默认 Bing
  setEngine(menu.querySelector('.eng-item.active') || items[0]);
})();
</script>
</body>
</html>
