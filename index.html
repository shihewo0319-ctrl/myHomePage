<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myHomePage · 我的首页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c9b8e8'/%3E%3Cstop offset='1' stop-color='%23b8d4f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='10' fill='white' opacity='0.92'/%3E%3C/svg%3E">
<style>
:root{--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;--serif:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;--mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;background:#f7f6f3;color:#3c3b38}

/* 素雅弥散光背景：浅色底 + 低饱和微光，静止无动画 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 46% at 16% 14%, rgba(188,176,233,.24), transparent 70%),
    radial-gradient(40% 48% at 86% 10%, rgba(166,196,238,.20), transparent 70%),
    radial-gradient(36% 44% at 82% 92%, rgba(186,222,214,.20), transparent 70%),
    radial-gradient(30% 36% at 12% 90%, rgba(236,208,182,.16), transparent 70%);
  filter:blur(70px);
}

.brand{position:fixed;top:22px;left:26px;z-index:40;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:#8a8578;letter-spacing:.08em}
.brand i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#c9b8e8,#b8d4f7);box-shadow:0 0 10px rgba(150,130,220,.4)}

.stage{position:relative;z-index:2;min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 24px 80px;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;padding:48px 64px 40px;width:min(660px,92vw);
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.95);border-radius:28px;
  box-shadow:0 24px 60px rgba(60,55,80,.10),0 4px 14px rgba(60,55,80,.05)}
.clock{font-size:80px;font-weight:500;line-height:1.05;letter-spacing:.02em;color:#33322f;font-variant-numeric:tabular-nums}
.date{font-size:14px;margin-top:10px;color:#8b8a85;letter-spacing:.06em}
.greet{font-size:16px;margin-top:22px;color:#6f6e69}
.search-wrap{position:relative;width:min(560px,86vw);margin-top:18px}
.search{display:flex;align-items:center;width:100%;border:1px solid #e8e5de;background:rgba(255,255,255,.85);border-radius:999px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:#c3b8e8;box-shadow:0 0 0 4px rgba(178,160,232,.16)}
.eng-btn{display:flex;align-items:center;gap:7px;border:none;background:transparent;padding:0 6px 0 20px;height:52px;cursor:pointer;font-family:inherit;font-size:13.5px;color:#55544f;border-radius:999px 0 0 999px;transition:background .18s;flex-shrink:0}
.eng-btn:hover{background:rgba(0,0,0,.03)}
.eng-btn .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#c9b8e8,#b8d4f7);box-shadow:0 0 6px rgba(150,130,220,.35);flex-shrink:0}
.eng-btn .caret{font-size:9px;color:#9a978f;transition:transform .18s}
.eng-btn.open .caret{transform:rotate(180deg)}
.search .divider{width:1px;height:22px;background:#e5e2db;flex-shrink:0}
.search input{flex:1;min-width:0;height:52px;border:none;background:transparent;padding:0 20px 0 14px;font-size:15px;outline:none;font-family:inherit;color:#3c3b38}
.search input::placeholder{color:#b0aea7}
.eng-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:30;min-width:190px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #e9e6df;border-radius:16px;box-shadow:0 14px 34px rgba(60,55,80,.14);padding:6px;display:none;text-align:left}
.eng-menu.open{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.eng-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;padding:9px 12px;border-radius:11px;font-size:13.5px;color:#55544f;cursor:pointer;font-family:inherit;text-align:left;transition:background .15s}
.eng-item .lbl{flex:1}
.eng-item:hover{background:#f2f0eb}
.eng-item.active{color:#5b5580;font-weight:600;background:linear-gradient(135deg,#f3eefb,#e9f0f9)}
.eng-item .check{color:#8a7fb5;font-size:12px;opacity:0}
.eng-item.active .check{opacity:1}
.links{display:grid;grid-template-columns:repeat(5,104px);gap:18px;margin-top:40px}
.link{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;padding:18px 8px 15px;border-radius:16px;
  background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);color:#55544f;
  box-shadow:0 6px 16px rgba(60,55,80,.07);
  transition:transform .18s,box-shadow .18s,background .18s}
.link:hover{transform:translateY(-4px);background:rgba(255,255,255,.94);box-shadow:0 14px 28px rgba(60,55,80,.13)}
.ic{font-size:24px;line-height:1}
.lb{font-size:12.5px;color:#6f6e69}

/* 应用台按钮 */
.dock-btn{position:fixed;top:20px;right:26px;z-index:40;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:#6f6e69;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.95);border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(60,55,80,.08);transition:transform .18s,box-shadow .18s;font-family:inherit}
.dock-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(60,55,80,.13)}
.dock-btn .gicon{display:grid;grid-template-columns:repeat(2,4px);grid-template-rows:repeat(2,4px);gap:2.5px}
.dock-btn .gicon i{width:4px;height:4px;border-radius:1.5px;background:linear-gradient(135deg,#c9b8e8,#b8d4f7)}

/* 应用台弹窗 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(42,38,54,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{position:relative;width:min(720px,94vw);max-height:84vh;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.98);border-radius:24px;box-shadow:0 30px 80px rgba(50,44,70,.3);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid #efebe3}
.modal-title{font-size:16px;font-weight:700;color:#4a4842;flex-shrink:0}
.modal-search{flex:1}
.modal-search input{width:100%;height:38px;border:1px solid #e8e5de;background:rgba(255,255,255,.9);border-radius:999px;padding:0 16px;font-size:13px;outline:none;font-family:inherit;color:#3c3b38}
.modal-search input:focus{border-color:#c3b8e8;box-shadow:0 0 0 3px rgba(178,160,232,.15)}
.modal-close{border:none;background:#f2f0eb;width:34px;height:34px;border-radius:999px;cursor:pointer;color:#6f6e69;font-size:14px;flex-shrink:0;transition:background .15s;font-family:inherit}
.modal-close:hover{background:#e6e3dc}
.modal-body{overflow-y:auto;padding:18px 22px 22px}
.dock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.dock-app{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;padding:14px 6px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.75);transition:transform .16s,box-shadow .16s,background .16s;box-shadow:0 4px 12px rgba(60,55,80,.06)}
.dock-app:hover{transform:translateY(-3px);background:#fff;box-shadow:0 10px 22px rgba(60,55,80,.12)}
.av{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;position:relative;overflow:hidden}
.av .fav{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px;background:#fff;border-radius:13px;box-sizing:border-box}
.nm{font-size:12px;color:#5c5b55;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-empty{grid-column:1/-1;text-align:center;color:#a5a29a;font-size:13px;padding:30px 0}

/* 应用台设置模式 */
.set-btn{border:1px solid #e5e2db;background:#f6f4ef;border-radius:999px;padding:0 14px;height:34px;cursor:pointer;color:#6f6e69;font-size:12.5px;flex-shrink:0;transition:background .15s,border-color .15s,color .15s;font-family:inherit}
.set-btn:hover{background:#ebe8e0}
.set-btn.on{background:linear-gradient(135deg,#efe8fb,#e3ecf8);border-color:#cfc4e8;color:#5b5580}
.dock-grid.editing .dock-app{position:relative;cursor:default}
.dock-grid.editing .dock-app:hover{transform:none;background:rgba(255,255,255,.85)}
.del{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:999px;background:#e5554f;color:#fff;border:none;cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15);font-family:inherit}
.del:hover{background:#d04039}
.add-tile{border:2px dashed #d8d4c8;background:rgba(255,255,255,.5);color:#9a978f;cursor:pointer;font-family:inherit}
.add-tile:hover{transform:translateY(-3px);background:#fff}
.av.plus{background:#f2f0eb;color:#8a8578}
.dock-foot{display:none;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px 16px;border-top:1px solid #efebe3}
.dock-foot.show{display:flex}
.foot-msg{font-size:12.5px;color:#b0685f;flex:1;text-align:left}
.foot-btns{display:flex;gap:10px}
.save-btn{border:none;background:linear-gradient(135deg,#b8a6e8,#9db8e8);color:#fff;font-size:13px;font-weight:600;padding:8px 20px;border-radius:999px;cursor:pointer;font-family:inherit}
.save-btn:hover{opacity:.9}
.cancel-btn{border:1px solid #e5e2db;background:#f6f4ef;color:#6f6e69;font-size:13px;padding:8px 18px;border-radius:999px;cursor:pointer;font-family:inherit}
.cancel-btn:hover{background:#ebe8e0}
.add-overlay{position:absolute;inset:0;z-index:5;background:rgba(250,249,246,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
.add-overlay.show{display:flex}
.add-box{width:min(340px,86%);background:#fff;border:1px solid #e9e6df;border-radius:18px;box-shadow:0 18px 44px rgba(60,55,80,.18);padding:20px}
.add-title{font-size:14px;font-weight:700;color:#4a4842;margin-bottom:14px}
.add-box input{width:100%;height:40px;border:1px solid #e8e5de;border-radius:10px;padding:0 14px;font-size:13.5px;outline:none;font-family:inherit;color:#3c3b38;margin-bottom:10px;background:#fbfaf7}
.add-box input:focus{border-color:#c3b8e8;box-shadow:0 0 0 3px rgba(178,160,232,.15)}
.add-err{font-size:12px;color:#c0554b;margin:0 0 10px;display:none}
.add-actions{display:flex;justify-content:flex-end;gap:8px}

@media (max-width:560px){
  .links{grid-template-columns:repeat(5,60px);gap:8px}
  .link{padding:12px 3px 10px}
  .clock{font-size:58px}
  .hero{padding:34px 18px 28px}
  .brand{font-size:12px}
}
</style>
</head>
<body>

<!-- 应用台弹窗 -->

  <div class="modal-box">

<script>
function tick(){
  var d = new Date();
  var h = String(d.getHours()).padStart(2,'0');
  var m = String(d.getMinutes()).padStart(2,'0');
  var el = document.querySelector('.clock');
  if(el) el.textContent = h + ':' + m;
  var dt = document.querySelector('.date');
  if(dt){
    var wd = ['日','一','二','三','四','五','六'][d.getDay()];
    dt.textContent = (d.getMonth()+1) + '月 ' + d.getDate() + '日 · 星期' + wd;
  }
  var g = document.querySelector('.greet');
  if(g){
    var hr = d.getHours();
    g.textContent = hr < 6 ? '夜深了，注意休息'
      : hr < 10 ? '早上好，愿你被世界温柔以待'
      : hr < 12 ? '上午好，元气满满'
      : hr < 14 ? '中午好，别忘了好好吃饭'
      : hr < 18 ? '下午好，继续加油'
      : '晚上好，辛苦一天了';
  }
}
tick();
setInterval(tick, 1000);

// 搜索引擎切换（搜索框内左侧下拉按钮）
(function(){
  var form = document.getElementById('searchForm');
  var input = form.querySelector('input');
  var btn = document.getElementById('engBtn');
  var label = document.getElementById('engLabel');
  var menu = document.getElementById('engMenu');
  var items = menu.querySelectorAll('.eng-item');

  function setEngine(item){
    label.textContent = item.getAttribute('data-name');
    form.action = item.getAttribute('data-action');
    input.placeholder = '搜索或输入网址，回车直达 ' + item.getAttribute('data-name');
    items.forEach(function(i){ i.classList.toggle('active', i === item); });
  }
  function closeMenu(){
    menu.classList.remove('open');
    btn.classList.remove('open');
  }
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var isOpen = menu.classList.contains('open');
    closeMenu();
    if(!isOpen){
      menu.classList.add('open');
      btn.classList.add('open');
    }
  });
  items.forEach(function(item){
    item.addEventListener('click', function(e){
      e.stopPropagation();
      setEngine(item);
      closeMenu();
    });
  });
  document.addEventListener('click', function(){
    closeMenu();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeMenu();
  });
  // 默认 Bing
  setEngine(menu.querySelector('.eng-item.active') || items[0]);
})();

// ===== 应用台（数据来自 Firefox 收藏夹，可在 APPS 数组增删改）=====
var APPS = [
  { name:'Proton Mail',   url:'https://mail.proton.me/u/0/inbox' },
  { name:'YouTube',       url:'https://www.youtube.com/' },
  { name:'bilibili',      url:'https://www.bilibili.com/' },
  { name:'RuTracker',     url:'https://rutracker.org/forum/index.php' },
  { name:'Pirate Bay',    url:'https://thepiratebay.org/index.html' },
  { name:'Claude',        url:'https://claude.ai/new' },
  { name:'Gemini',        url:'https://gemini.google.com/app' },
  { name:'DeepSeek',      url:'https://chat.deepseek.com/' },
  { name:'IELTS Tests',   url:'https://ieltsonlinetests.com/' },
  { name:'IELTS Mock',    url:'https://ieltsonlinetests.com/score/57764880?passage=4' },
  { name:'Myinstants',    url:'https://www.myinstants.com/en/index/us/' },
  { name:'Excalidraw',    url:'https://excalidraw.com/' },
  { name:'LobeHub Icons', url:'https://lobehub.com/zh/icons' },
  { name:'Notebook',      url:'http://127.0.0.1:8502/sources' }
];
var PALETTE = [
  ['#e6def8','#6a5f9e'], ['#dde9f8','#5b7ba3'], ['#def0ea','#4f8070'],
  ['#fae6d8','#a3704f'], ['#f4ecd8','#8f7a45'], ['#f6dfe6','#9e5f76']
];
(function(){
  var modal = document.getElementById('dockModal');
  var grid = document.getElementById('dockGrid');
  var filter = document.getElementById('dockFilter');
  var setBtn = document.getElementById('dockSettingsBtn');
  var foot = document.getElementById('dockFoot');
  var footMsg = document.getElementById('footMsg');
  var overlay = document.getElementById('addOverlay');
  var addName = document.getElementById('addName');
  var addUrl = document.getElementById('addUrl');
  var addErr = document.getElementById('addErr');

  var editing = false;
  var currentApps = APPS.map(function(a){ return { name:a.name, url:a.url }; });
  var savedApps = currentApps.map(function(a){ return { name:a.name, url:a.url }; });

  function clone(list){ return list.map(function(a){ return { name:a.name, url:a.url }; }); }
  function hashOf(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }

  function renderApps(kw){
    var k = (kw||'').toLowerCase();
    grid.innerHTML = '';
    grid.classList.toggle('editing', editing);
    var shown = 0;
    currentApps.forEach(function(app, idx){
      if(!editing && k && app.name.toLowerCase().indexOf(k) === -1 && app.url.toLowerCase().indexOf(k) === -1) return;
      shown++;
      var domain = '';
      var origin = null;
      try { var u = new URL(app.url); origin = u.origin; domain = u.host; } catch(e) { domain = app.url; }
      var c = PALETTE[hashOf(domain) % PALETTE.length];
      var a = document.createElement('a');
      a.className = 'dock-app';
      a.href = app.url;
      var av = document.createElement('span');
      av.className = 'av';
      av.style.background = c[0];
      av.style.color = c[1];
      av.textContent = (app.name.charAt(0) || '?').toUpperCase();
      // 真实网页图标：经本机服务器 /favicon/ 代理抓取，失败自动回退字母
      if(origin){
        var img = document.createElement('img');
        img.className = 'fav';
        img.alt = '';
        img.src = '/favicon/?u=' + encodeURIComponent(origin);
        img.addEventListener('error', function(){ img.remove(); });
        av.appendChild(img);
      }
      var nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = app.name;
      nm.title = app.url;
      a.appendChild(av);
      a.appendChild(nm);
      if(editing){
        a.addEventListener('click', function(e){ e.preventDefault(); });
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除 ' + app.name;
        del.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          currentApps.splice(idx, 1);
          renderApps('');
        });
        a.appendChild(del);
      } else {
        a.target = '_blank';
        a.rel = 'noopener';
        a.addEventListener('click', function(){ closeDock(); });
      }
      grid.appendChild(a);
    });
    if(editing){
      var add = document.createElement('button');
      add.type = 'button';
      add.className = 'dock-app add-tile';
      add.innerHTML = '<span class="av plus">＋</span><span class="nm">添加应用</span>';
      add.addEventListener('click', openAddForm);
      grid.appendChild(add);
    }
    if(shown === 0 && !editing){
      var p = document.createElement('p');
      p.className = 'dock-empty';
      p.textContent = '没有匹配的应用';
      grid.appendChild(p);
    }
  }

  function enterSettings(){
    currentApps = clone(savedApps);
    editing = true;
    setBtn.classList.add('on');
    foot.classList.add('show');
    document.querySelector('.modal-search').style.display = 'none';
    filter.value = '';
    footMsg.textContent = '编辑后记得点「保存」';
    renderApps('');
  }
  function exitSettings(commit){
    if(commit){
      savedApps = clone(currentApps);
    } else {
      currentApps = clone(savedApps);
    }
    editing = false;
    setBtn.classList.remove('on');
    foot.classList.remove('show');
    document.querySelector('.modal-search').style.display = '';
    footMsg.textContent = '';
    renderApps('');
  }
  function saveApps(){
    fetch('/apps.json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentApps)
    }).then(function(r){
      return r.json().then(function(j){ return { ok:r.ok, status:r.status, j:j }; }).catch(function(){ return { ok:r.ok, status:r.status, j:{} }; });
    }).then(function(res){
      if(res.ok){
        exitSettings(true);
      } else {
        footMsg.textContent = '保存失败（HTTP ' + res.status + '）';
      }
    }).catch(function(){
      footMsg.textContent = '保存失败：页面未通过服务器打开（file:// 模式不支持保存）';
    });
  }

  function openAddForm(){
    addName.value = '';
    addUrl.value = '';
    addErr.style.display = 'none';
    overlay.classList.add('show');
    setTimeout(function(){ addName.focus(); }, 50);
  }
  function closeAddForm(){ overlay.classList.remove('show'); }
  document.getElementById('addOkBtn').addEventListener('click', function(){
    var n = addName.value.trim();
    var u = addUrl.value.trim();
    if(!n){ addErr.textContent = '请输入名称'; addErr.style.display = 'block'; return; }
    if(!/^https?:\/\/.+/.test(u)){ addErr.textContent = '网址需以 http:// 或 https:// 开头'; addErr.style.display = 'block'; return; }
    currentApps.push({ name:n, url:u });
    closeAddForm();
    renderApps('');
  });
  document.getElementById('addCancelBtn').addEventListener('click', closeAddForm);
  addUrl.addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('addOkBtn').click();
  });

  function openDock(){
    modal.classList.add('open');
    filter.value = '';
    renderApps('');
    setTimeout(function(){ filter.focus(); }, 60);
  }
  function closeDock(){
    if(editing) exitSettings(false);
    modal.classList.remove('open');
    closeAddForm();
  }
  document.getElementById('dockBtn').addEventListener('click', openDock);
  document.getElementById('dockClose').addEventListener('click', closeDock);
  setBtn.addEventListener('click', function(){ if(editing) exitSettings(false); else enterSettings(); });
  document.getElementById('dockSaveBtn').addEventListener('click', saveApps);
  document.getElementById('dockCancelBtn').addEventListener('click', function(){ exitSettings(false); });
  modal.addEventListener('click', function(e){ if(e.target === modal) closeDock(); });
  filter.addEventListener('input', function(){ renderApps(filter.value); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDock(); });

  // 启动时尝试从服务器读取已保存的应用列表（apps.json），读不到则用内置种子
  fetch('/apps.json').then(function(r){
    if(!r.ok) return null;
    return r.json();
  }).then(function(list){
    if(Array.isArray(list) && list.length >= 0){
      var clean = list.map(function(a){
        return { name: String(a.name || '').slice(0, 80), url: String(a.url || '') };
      }).filter(function(a){ return a.name && /^https?:\/\//.test(a.url); });
      currentApps = clean;
      savedApps = clone(clean);
      renderApps('');
    }
  }).catch(function(){});
  renderApps('');
})();
</script>
</body>
</html>
